<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commander un service - PLUS-TECH.COM</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .order-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
        }

        .order-container h1 {
            text-align: center;
            color: #0b1f3a;
        }

        .order-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .order-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #0b1f3a;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .imei-note {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PLUS-TECH.COM</div>
</header>

<main class="order-container">

    <a href="service-imei.html" class="back-link">
        ← Retour aux services IMEI
    </a>

    <h1>Commander un service</h1>

    <p>
        Remplissez les informations de votre appareil.
    </p>

    <form class="order-form" onsubmit="sendWhatsApp(event)">

        <div class="form-group">
            <label for="name">Nom complet</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="phone">WhatsApp / Téléphone</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="service">Service</label>

            <select id="service" required>
                <option value="">-- Sélectionnez un service --</option>

                <option value="MDM Tecno / Infinix / itel">
                    MDM Tecno / Infinix / itel — 15 000 FCFA
                </option>

                <option value="FRP Samsung Android 16-17">
                    FRP Samsung Android 16-17 — 25 000 FCFA
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="imei">IMEI</label>

            <input
                type="text"
                id="imei"
                inputmode="numeric"
                maxlength="15"
                pattern="[0-9]{15}"
                placeholder="Entrez les 15 chiffres de l'IMEI"
                required
            >

            <div class="imei-note">
                L'IMEI doit contenir exactement 15 chiffres.
            </div>
        </div>

        <div class="form-group">
            <label for="device">Appareil / Modèle</label>

            <input
                type="text"
                id="device"
                placeholder="Exemple : Samsung Galaxy A16"
                required
            >
        </div>

        <div class="form-group">
            <label for="message">Décrivez votre demande</label>

            <textarea
                id="message"
                placeholder="Décrivez brièvement votre demande..."
            ></textarea>
        </div>

        <button type="submit" class="submit-btn">
            📱 Envoyer la commande sur WhatsApp
        </button>

    </form>

</main>

<footer>
    <p>© 2026 PLUS-TECH.COM. All rights reserved.</p>
</footer>

<script>
/* Sélection automatique du service */
const params = new URLSearchParams(window.location.search);
const selectedService = params.get("service");

if (selectedService) {
    const serviceSelect = document.getElementById("service");

    for (let option of serviceSelect.options) {
        if (option.value === selectedService) {
            serviceSelect.value = selectedService;
            break;
        }
    }
}


/* Envoi de la commande sur WhatsApp */
function sendWhatsApp(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const service = document.getElementById("service").value;
    const imei = document.getElementById("imei").value;
    const device = document.getElementById("device").value;
    const message = document.getElementById("message").value;

    const whatsappMessage =
        "Bonjour PLUS-TECH.COM,%0A%0A" +
        "*Nouvelle demande de service*%0A%0A" +
        "*Nom:* " + name + "%0A" +
        "*WhatsApp / Téléphone:* " + phone + "%0A" +
        "*Service:* " + service + "%0A" +
        "*IMEI:* " + imei + "%0A" +
        "*Appareil:* " + device + "%0A" +
        "*Demande:* " + message;

    const whatsappURL =
        "https://wa.me/23672089545?text=" + whatsappMessage;

    window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
