<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commander un service - PLUS-TECH.COM</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .order-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
        }

        .order-container h1 {
            text-align: center;
            color: #0b1f3a;
        }

        .order-container > p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .order-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #0b1f3a;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .imei-note {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PLUS-TECH.COM</div>
</header>

<main class="order-container">

    <a href="imei-service.html" class="back-link">
        ← Retour aux services IMEI
    </a>

    <h1>Commander un service</h1>

    <p>
        Remplissez les informations de votre appareil.
    </p>

    <form class="order-form" id="orderForm">

        <div class="form-group">
            <label for="name">Nom complet</label>
            <input type="text" id="name" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
            <label for="phone">WhatsApp / Téléphone</label>
            <input type="tel" id="phone" placeholder="Votre numéro" required>
        </div>

        <div class="form-group">
            <label for="service">Service</label>

            <select id="service" required>
                <option value="">-- Sélectionnez un service --</option>

                <option value="MDM Tecno / Infinix / itel">
                    MDM Tecno / Infinix / itel — 15 000 FCFA
                </option>

                <option value="FRP Samsung Android 16-17">
                    FRP Samsung Android 16-17 — 25 000 FCFA
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="imei">IMEI</label>

            <input
                type="text"
                id="imei"
                inputmode="numeric"
                maxlength="15"
                pattern="[0-9]{15}"
                placeholder="Entrez les 15 chiffres de l'IMEI"
                required
            >

            <div class="imei-note">
                L'IMEI doit contenir exactement 15 chiffres.
            </div>
        </div>

        <div class="form-group">
            <label for="device">Appareil / Modèle</label>

            <input
                type="text"
                id="device"
                placeholder="Exemple : Samsung Galaxy A16"
                required
            >
        </div>

        <div class="form-group">
            <label for="message">Décrivez votre demande</label>

            <textarea
                id="message"
                placeholder="Décrivez brièvement votre demande..."
            ></textarea>
        </div>

        <button type="submit" class="submit-btn">
            📱 Envoyer la commande
        </button>

        <div id="result"></div>

    </form>

</main>

<footer>
    <p>© 2026 PLUS-TECH.COM. Tous droits réservés.</p>
</footer>


<script>

/*
    =====================================================
    CONFIGURATION SUPABASE
    =====================================================

    IMPORTANT :
    Remplace seulement les deux valeurs ci-dessous
    par ton API URL et ta Publishable key.

    N'utilise PAS une clé secret ou service_role.
*/

const SUPABASE_URL = "https://bmwtivvdrupshuselftd.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_MsfE7VdvEr9Ax0H4YrA5KQ_8_Ho-JZf";


/*
    Récupérer automatiquement le service choisi
*/

const params = new URLSearchParams(window.location.search);

const selectedService = params.get("service");

if (selectedService) {

    const serviceSelect = document.getElementById("service");

    for (let option of serviceSelect.options) {

        if (option.value === selectedService) {

            serviceSelect.value = selectedService;

            break;
        }
    }
}


/*
    Envoyer la commande
*/

document.getElementById("orderForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const result = document.getElementById("result");

    result.style.display = "none";

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const service =
        document.getElementById("service").value;

    const imei =
        document.getElementById("imei").value.trim();

    const device =
        document.getElementById("device").value.trim();

    const message =
        document.getElementById("message").value.trim();


    /*
        Vérification IMEI
    */

    if (!/^[0-9]{15}$/.test(imei)) {

        result.className = "error";

        result.textContent =
            "L'IMEI doit contenir exactement 15 chiffres.";

        result.style.display = "block";

        return;
    }


    /*
        Données envoyées à Supabase
    */

    const orderData = {

        full_name: name,

        phone: phone,

        service: service,

        imei: imei,

        device: device,

        request: message,

        status: "Nouvelle"

    };


    try {

        /*
            Enregistrement dans Supabase
        */

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/orders",
            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json",

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Prefer": "return=minimal"

                },

                body: JSON.stringify(orderData)

            }
        );


        /*
            Vérification de la réponse
        */

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(errorText);

            throw new Error(
                "Impossible d'enregistrer la commande."
            );
        }


        /*
            Message WhatsApp
        */

        const whatsappMessage =

            "Bonjour PLUS-TECH.COM,\n\n" +

            "Nouvelle demande de service\n\n" +

            "Nom : " + name + "\n" +

            "WhatsApp / Téléphone : " + phone + "\n" +

            "Service : " + service + "\n" +

            "IMEI : " + imei + "\n" +

            "Appareil : " + device + "\n" +

            "Demande : " + message + "\n\n" +

            "Statut : Nouvelle";


        const whatsappURL =

            "https://wa.me/23672089545?text=" +

            encodeURIComponent(whatsappMessage);


        /*
            Confirmation
        */

        result.className = "success";

        result.textContent =
            "✅ Commande enregistrée avec succès. Ouverture de WhatsApp...";

        result.style.display = "block";


        /*
            Ouvrir WhatsApp
        */

        setTimeout(function() {

            window.open(
                whatsappURL,
                "_blank"
            );

        }, 500);


        /*
            Réinitialiser le formulaire
        */

        document.getElementById("orderForm").reset();

    }

    catch (error) {

        console.error(error);

        result.className = "error";

        result.textContent =
            "❌ Une erreur est survenue. Vérifiez la configuration Supabase.";

        result.style.display = "block";

    }

});

</script>

</body>
</html>
