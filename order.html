<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Commander - PLUS-TECH.COM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      color: #0b5ed7;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      display: block !important;
      background: #f8d7da;
      color: #842029;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
      color: #0b5ed7;
    }

    .tracking-box {
      margin-top: 15px;
      padding: 15px;
      background: #eef5ff;
      border: 2px solid #0b5ed7;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .tracking-code {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      color: #0b5ed7;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

<header>
  <h1>PLUS-TECH.COM</h1>
  <p>Commande de service</p>
</header>

<div class="container">

  <div class="card">

    <h2>Passer une commande</h2>

    <form id="orderForm">

      <label for="full_name">Nom complet</label>
      <input
        type="text"
        id="full_name"
        placeholder="Votre nom complet"
        required
      >

      <label for="phone">WhatsApp / Téléphone</label>
      <input
        type="tel"
        id="phone"
        placeholder="Votre numéro WhatsApp"
        required
      >

      <label for="service">Service</label>

      <select id="service" required>

        <option value="">
          -- Choisir un service --
        </option>

        <option value="MDM Tecno / Infinix / itel">
          MDM Tecno / Infinix / itel - 15 000 FCFA
        </option>

        <option value="FRP Samsung Android 16-17">
          FRP Samsung Android 16-17 - 25 000 FCFA
        </option>

      </select>

      <label for="imei">IMEI</label>

      <input
        type="text"
        id="imei"
        inputmode="numeric"
        maxlength="15"
        placeholder="15 chiffres"
        required
      >

      <label for="device">Appareil / Modèle</label>

      <input
        type="text"
        id="device"
        placeholder="Exemple : Samsung Galaxy A..."
        required
      >

      <label for="request">Votre demande</label>

      <textarea
        id="request"
        placeholder="Décrivez votre demande..."
      ></textarea>

      <button
        type="submit"
        id="submitButton"
      >
        📱 Envoyer la commande
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="imei-service.html"
    >
      ← Retour aux services
    </a>

  </div>

</div>


<script>

/* ================================
   CONFIGURATION SUPABASE
================================ */

const SUPABASE_URL =
  "https://swbjlvwttlpjfrnvbrwv.supabase.co/rest/v1/";

/*
   COLLE ICI TA PUBLISHABLE KEY ACTUELLE
   (celle qui fonctionne déjà dans ton ancien order.html)
*/

const SUPABASE_KEY =
  "sb_publishable_Pjp5z2zXmhft_bcuInMc2A_PKIEYRq1";


/* ================================
   ÉLÉMENTS DE LA PAGE
================================ */

const form =
  document.getElementById("orderForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


/* ================================
   MESSAGE
================================ */

function showMessage(text, type) {

  message.textContent = text;

  message.className = type;

  message.style.display = "block";
}


/* ================================
   GÉNÉRER CODE DE SUIVI
================================ */

function generateTrackingCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 6; i++) {

    code +=
      chars[Math.floor(Math.random() * chars.length)];

  }

  return "PT-" + code;
}


/* ================================
   ENVOI DE LA COMMANDE
================================ */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    /* Récupération des données */

    const fullName =
      document
        .getElementById("full_name")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const service =
      document
        .getElementById("service")
        .value;

    const imei =
      document
        .getElementById("imei")
        .value
        .trim();

    const device =
      document
        .getElementById("device")
        .value
        .trim();

    const request =
      document
        .getElementById("request")
        .value
        .trim();


    /* Vérification */

    if (
      !fullName ||
      !phone ||
      !service ||
      !imei ||
      !device
    ) {

      showMessage(
        "❌ Merci de remplir tous les champs obligatoires.",
        "error"
      );

      return;
    }


    /* Vérification IMEI */

    if (!/^[0-9]{15}$/.test(imei)) {

      showMessage(
        "❌ L'IMEI doit contenir exactement 15 chiffres.",
        "error"
      );

      return;
    }


    /* Vérification clé */

    if (
      SUPABASE_KEY ===
      "COLLE_ICI_TA_PUBLISHABLE_KEY"
    ) {

      showMessage(
        "❌ La Publishable Key Supabase n'a pas encore été ajoutée dans order.html.",
        "error"
      );

      return;
    }


    /* Désactiver bouton */

    submitButton.disabled = true;

    submitButton.textContent =
      "⏳ Enregistrement...";


    /* ================================
       CRÉATION DU CODE DE SUIVI
    ================================= */

    const trackingCode =
      generateTrackingCode();


    /* ================================
       DONNÉES DE LA COMMANDE
    ================================= */

    const orderData = {

      full_name: fullName,

      phone: phone,

      service: service,

      imei: imei,

      device: device,

      request: request,

      status: "Nouvelle",

      tracking_code: trackingCode

    };


    try {


      /* ================================
         ENVOI À SUPABASE
      ================================= */

      const response =
        await fetch(
          SUPABASE_URL + "orders",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(orderData)

          }
        );


      const responseText =
        await response.text();


      /* Erreur Supabase */

      if (!response.ok) {

        throw new Error(
          "Supabase (" +
          response.status +
          ") : " +
          responseText
        );

      }


      /* ================================
         MESSAGE DE SUCCÈS
      ================================= */

      message.innerHTML =

        "✅ <strong>Commande enregistrée avec succès !</strong>" +

        '<div class="tracking-box">' +

        "🔎 Votre code de suivi" +

        '<span class="tracking-code">' +

        trackingCode +

        "</span>" +

        "<small>Conservez bien ce code.</small>" +

        "</div>" +

        "<br>" +

        "Redirection vers WhatsApp...";


      message.className =
        "success";

      message.style.display =
        "block";


      /* ================================
         MESSAGE WHATSAPP
      ================================= */

      const whatsappMessage =

        "🛒 NOUVELLE COMMANDE - PLUS-TECH.COM\n\n" +

        "🔎 Code de suivi : " +
        trackingCode +
        "\n\n" +

        "Nom : " +
        fullName +
        "\n" +

        "Téléphone : " +
        phone +
        "\n" +

        "Service : " +
        service +
        "\n" +

        "IMEI : " +
        imei +
        "\n" +

        "Appareil : " +
        device +
        "\n" +

        "Demande : " +
        (
          request ||
          "Aucune précision"
        ) +
        "\n\n" +

        "Statut : Nouvelle";


      const whatsappURL =

        "https://wa.me/23672089545?text=" +

        encodeURIComponent(
          whatsappMessage
        );


      /* ================================
         REDIRECTION WHATSAPP
      ================================= */

      setTimeout(
        function() {

          window.location.href =
            whatsappURL;

        },
        2500
      );


    } catch (error) {


      console.error(
        "Erreur Supabase :",
        error
      );


      showMessage(
        "❌ " + error.message,
        "error"
      );


    } finally {


      submitButton.disabled =
        false;

      submitButton.textContent =
        "📱 Envoyer la commande";

    }

  }
);

</script>

</body>
</html>
