<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Service - PLUS-TECH.COM</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .order-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .order-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .order-card h1 {
            color: #0b1f3a;
            margin-bottom: 10px;
        }

        .order-card p {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #25D366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PLUS-TECH.COM</div>
</header>

<main class="order-container">

    <a href="imei-service.html" class="back-link">
        ← Back to IMEI Service
    </a>

    <div class="order-card">

        <h1>Order Service</h1>

        <p>
            Fill in the information below to submit your service request.
        </p>

        <form id="orderForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="contact">WhatsApp / Phone</label>

                <input
                    type="tel"
                    id="contact"
                    placeholder="Enter your WhatsApp or phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="service">Service</label>

                <select id="service" required>

                    <option value="">Select a service</option>

                    <option value="IMEI Service">
                        IMEI Service
                    </option>

                    <option value="Network Service">
                        Network Service
                    </option>

                    <option value="iCloud Service">
                        iCloud Service
                    </option>

                    <option value="Server Service">
                        Server Service
                    </option>

                    <option value="Digital Tools">
                        Digital Tools
                    </option>

                    <option value="Activation Service">
                        Activation Service
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="device">Device / Model</label>

                <input
                    type="text"
                    id="device"
                    placeholder="Example: Samsung Galaxy S23">
            </div>

            <div class="form-group">
                <label for="message">Describe your request</label>

                <textarea
                    id="message"
                    placeholder="Describe the service you need"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Order on WhatsApp
            </button>

        </form>

    </div>

</main>

<footer>
    <p>© 2026 PLUS-TECH.COM. All rights reserved.</p>
</footer>


<script>

document.getElementById("orderForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const contact = document.getElementById("contact").value;
    const service = document.getElementById("service").value;
    const device = document.getElementById("device").value;
    const message = document.getElementById("message").value;

    const whatsappMessage =
        "Bonjour PLUS-TECH.COM,%0A%0A" +
        "*Nouvelle demande de service*%0A%0A" +
        "*Nom:* " + encodeURIComponent(name) + "%0A" +
        "*WhatsApp / Téléphone:* " + encodeURIComponent(contact) + "%0A" +
        "*Service:* " + encodeURIComponent(service) + "%0A" +
        "*Appareil:* " + encodeURIComponent(device) + "%0A" +
        "*Demande:* " + encodeURIComponent(message);

    const whatsappURL =
        "https://wa.me/23672089545?text=" + whatsappMessage;

    window.open(whatsappURL, "_blank");

});

</script>

</body>
</html>
