<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - PLUS-TECH.COM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b5ed7;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .login-button {
      width: 100%;
      margin-top: 20px;
    }

    .logout {
      background: #dc3545;
      float: right;
    }

    .refresh {
      margin-bottom: 20px;
    }

    #loginPanel {
      max-width: 600px;
      margin: auto;
    }

    #adminPanel {
      display: none;
    }

    #message {
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      display: block !important;
      background: #f8d7da;
      color: #842029;
    }

    .success {
      display: block !important;
      background: #d1e7dd;
      color: #0f5132;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #0b5ed7;
      color: white;
    }

    tr:hover {
      background: #f5f8ff;
    }

    .status-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 150px;
    }

    .status-select {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    .save-status {
      background: #198754;
      padding: 9px 12px;
      font-size: 13px;
    }

    .save-status:disabled {
      background: #777;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .top-bar {
      overflow: hidden;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      display: inline-block;
      margin: 0;
    }

    .date {
      white-space: nowrap;
    }

    #ordersMessage {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 700px) {
      .card {
        padding: 18px;
      }

      .top-bar h2 {
        display: block;
        margin-bottom: 15px;
      }

      .logout {
        float: none;
        width: 100%;
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>PLUS-TECH.COM</h1>
  <p>Espace Administration</p>
</header>

<div class="container">

  <!-- CONNEXION -->
  <div class="card" id="loginPanel">

    <h2>🔐 Connexion Admin</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        required
      >

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Se connecter
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- ESPACE ADMIN -->
  <div class="card" id="adminPanel">

    <div class="top-bar">

      <button
        class="logout"
        id="logoutButton"
      >
        Se déconnecter
      </button>

      <h2>📋 Gestion des commandes</h2>

    </div>

    <button
      class="refresh"
      id="refreshButton"
    >
      🔄 Actualiser les commandes
    </button>

    <div id="ordersMessage"></div>

    <div class="table-container">

      <table>

        <thead>

          <tr>
            <th>Date</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Service</th>
            <th>IMEI</th>
            <th>Appareil</th>
            <th>Demande</th>
            <th>Statut</th>
          </tr>

        </thead>

        <tbody id="ordersBody">

          <tr>
            <td colspan="8" class="empty">
              Chargement des commandes...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://swbjlvwttlpjfrnvbrwv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Pjp5z2zXmhft_bcuInMc2A_PKIEYRq1";


const loginForm =
  document.getElementById("loginForm");

const loginPanel =
  document.getElementById("loginPanel");

const adminPanel =
  document.getElementById("adminPanel");

const message =
  document.getElementById("message");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const refreshButton =
  document.getElementById("refreshButton");

const ordersBody =
  document.getElementById("ordersBody");


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;
  message.style.display = "block";

}


function showOrdersMessage(text, type) {

  const box =
    document.getElementById("ordersMessage");

  box.textContent = text;
  box.className = type;
  box.style.display = "block";

}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   MODIFICATION DU STATUT
========================= */

async function updateOrderStatus(orderId, newStatus, button) {

  const accessToken =
    localStorage.getItem("plusTechAccessToken");

  if (!accessToken) {
    alert("Session expirée. Veuillez vous reconnecter.");
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Enregistrement...";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders?id=eq." +
      encodeURIComponent(orderId),
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          status: newStatus
        })
      }
    );

    const responseText =
      await response.text();

    if (!response.ok) {

      throw new Error(
        "Supabase (" +
        response.status +
        ") : " +
        responseText
      );

    }

    button.textContent = "✅ Enregistré";

    showOrdersMessage(
      "✅ Le statut de la commande a été mis à jour.",
      "success"
    );

    setTimeout(function() {
      button.textContent = "Enregistrer";
    }, 1500);

  } catch (error) {

    console.error(error);

    button.textContent = "❌ Erreur";

    showOrdersMessage(
      "❌ Impossible de modifier le statut : " +
      error.message,
      "error"
    );

    setTimeout(function() {
      button.textContent = "Enregistrer";
    }, 2000);

  } finally {

    button.disabled = false;

  }

}


/* =========================
   CHARGEMENT COMMANDES
========================= */

async function loadOrders() {

  const accessToken =
    localStorage.getItem("plusTechAccessToken");

  if (!accessToken) {
    return;
  }

  ordersBody.innerHTML = `
    <tr>
      <td colspan="8" class="empty">
        ⏳ Chargement des commandes...
      </td>
    </tr>
  `;

  refreshButton.disabled = true;
  refreshButton.textContent = "⏳ Chargement...";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders?select=*&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    const responseText =
      await response.text();

    if (!response.ok) {

      throw new Error(
        "Supabase (" +
        response.status +
        ") : " +
        responseText
      );

    }

    const orders =
      JSON.parse(responseText);

    if (!orders.length) {

      ordersBody.innerHTML = `
        <tr>
          <td colspan="8" class="empty">
            📭 Aucune commande enregistrée.
          </td>
        </tr>
      `;

      return;
    }

    ordersBody.innerHTML =
      orders.map(function(order) {

        const date =
          order.created_at
            ? new Date(order.created_at)
                .toLocaleString("fr-FR")
            : "—";

        const currentStatus =
          order.status || "Nouvelle";

        return `
          <tr>

            <td class="date">
              ${escapeHTML(date)}
            </td>

            <td>
              ${escapeHTML(order.full_name || "—")}
            </td>

            <td>
              ${escapeHTML(order.phone || "—")}
            </td>

            <td>
              ${escapeHTML(order.service || "—")}
            </td>

            <td>
              ${escapeHTML(order.imei || "—")}
            </td>

            <td>
              ${escapeHTML(order.device || "—")}
            </td>

            <td>
              ${escapeHTML(order.request || "—")}
            </td>

            <td>

              <div class="status-box">

                <select
                  class="status-select"
                  id="status-${escapeHTML(order.id)}"
                >

                  <option
                    value="Nouvelle"
                    ${currentStatus === "Nouvelle" ? "selected" : ""}
                  >
                    🆕 Nouvelle
                  </option>

                  <option
                    value="En cours"
                    ${currentStatus === "En cours" ? "selected" : ""}
                  >
                    🔄 En cours
                  </option>

                  <option
                    value="Terminée"
                    ${currentStatus === "Terminée" ? "selected" : ""}
                  >
                    ✅ Terminée
                  </option>

                  <option
                    value="Annulée"
                    ${currentStatus === "Annulée" ? "selected" : ""}
                  >
                    ❌ Annulée
                  </option>

                </select>

                <button
                  class="save-status"
                  data-order-id="${escapeHTML(order.id)}"
                >
                  Enregistrer
                </button>

              </div>

            </td>

          </tr>
        `;

      }).join("");


    /* Boutons Enregistrer */

    document
      .querySelectorAll(".save-status")
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            const orderId =
              button.getAttribute("data-order-id");

            const select =
              document.getElementById(
                "status-" + orderId
              );

            if (!select) {
              return;
            }

            updateOrderStatus(
              orderId,
              select.value,
              button
            );

          }
        );

      });


  } catch (error) {

    console.error(error);

    ordersBody.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          ❌ Impossible de charger les commandes.
          <br><br>
          ${escapeHTML(error.message)}
        </td>
      </tr>
    `;

  } finally {

    refreshButton.disabled = false;

    refreshButton.textContent =
      "🔄 Actualiser les commandes";

  }

}


/* =========================
   CONNEXION
========================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email")
        .value.trim();

    const password =
      document.getElementById("password")
        .value;

    if (
      SUPABASE_KEY ===
      "COLLE_ICI_TA_PUBLISHABLE_KEY"
    ) {

      showMessage(
        "❌ La Publishable key Supabase n'a pas été ajoutée.",
        "error"
      );

      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ Connexion...";

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          "Identifiants incorrects."
        );

      }

      localStorage.setItem(
        "plusTechAccessToken",
        data.access_token
      );

      loginPanel.style.display =
        "none";

      adminPanel.style.display =
        "block";

      await loadOrders();

    } catch (error) {

      showMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Se connecter";

    }

  }
);


/* =========================
   ACTUALISER
========================= */

refreshButton.addEventListener(
  "click",
  loadOrders
);


/* =========================
   DÉCONNEXION
========================= */

logoutButton.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "plusTechAccessToken"
    );

    adminPanel.style.display =
      "none";

    loginPanel.style.display =
      "block";

    loginForm.reset();

  }
);


/* =========================
   SESSION EXISTANTE
========================= */

if (
  localStorage.getItem(
    "plusTechAccessToken"
  )
) {

  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";

  loadOrders();

}

</script>

</body>
</html>
