<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - PLUS-TECH.COM</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b5ed7;
    }

    .info {
      background: #e7f1ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #0b5ed7;
      color: white;
    }

    .status {
      font-weight: bold;
    }

    @media (max-width: 700px) {
      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>PLUS-TECH.COM</h1>
  <p>Espace Administration</p>
</header>

<div class="container">

  <div class="card">

    <h2>📋 Gestion des commandes</h2>

    <div class="info">
      Cette page servira à consulter et gérer les commandes
      reçues sur PLUS-TECH.COM.
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Nom</th>
          <th>Service</th>
          <th>Appareil</th>
          <th>Statut</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>—</td>
          <td>—</td>
          <td>—</td>
          <td>—</td>
          <td class="status">En attente</td>
        </tr>
      </tbody>
    </table>

  </div>

</div>

</body>
</html>
