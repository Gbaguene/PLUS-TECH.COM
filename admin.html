<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - PLUS-TECH.COM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #0b5ed7;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
    }

    .error {
      display: block !important;
      background: #f8d7da;
      color: #842029;
    }

    .success {
      display: block !important;
      background: #d1e7dd;
      color: #0f5132;
    }

    #adminPanel {
      display: none;
    }

    .logout {
      background: #dc3545;
      margin-bottom: 20px;
    }

    .info {
      background: #e7f1ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>PLUS-TECH.COM</h1>
  <p>Espace Administration</p>
</header>

<div class="container">

  <!-- CONNEXION -->
  <div class="card" id="loginPanel">

    <h2>🔐 Connexion Admin</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit" id="loginButton">
        Se connecter
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- ESPACE ADMIN -->
  <div class="card" id="adminPanel">

    <h2>📋 Tableau de bord</h2>

    <div class="info">
      Bienvenue dans l'espace d'administration de PLUS-TECH.COM.
    </div>

    <p>
      🔐 Connexion administrateur réussie.
    </p>

    <p>
      La gestion des commandes sera ajoutée à l'étape suivante.
    </p>

    <button class="logout" id="logoutButton">
      Se déconnecter
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://swbjlvwttlpjfrnvbrwv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Pjp5z2zXmhft_bcuInMc2A_PKIEYRq1";


const loginForm =
  document.getElementById("loginForm");

const loginPanel =
  document.getElementById("loginPanel");

const adminPanel =
  document.getElementById("adminPanel");

const message =
  document.getElementById("message");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;
  message.style.display = "block";

}


loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (SUPABASE_KEY === "COLLE_ICI_TA_PUBLISHABLE_KEY") {

    showMessage(
      "❌ La Publishable key Supabase n'a pas encore été ajoutée.",
      "error"
    );

    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "⏳ Connexion...";

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Identifiants incorrects."
      );

    }

    localStorage.setItem(
      "plusTechAccessToken",
      data.access_token
    );

    loginPanel.style.display = "none";
    adminPanel.style.display = "block";

  } catch (error) {

    showMessage(
      "❌ " + error.message,
      "error"
    );

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "Se connecter";

  }

});


logoutButton.addEventListener("click", function() {

  localStorage.removeItem("plusTechAccessToken");

  adminPanel.style.display = "none";
  loginPanel.style.display = "block";

  loginForm.reset();

});


if (localStorage.getItem("plusTechAccessToken")) {

  loginPanel.style.display = "none";
  adminPanel.style.display = "block";

}

</script>

</body>
</html>
